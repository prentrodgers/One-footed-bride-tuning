<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage preview — camera &amp; lights</title>
<!--
  Box stand-in for the stage, for setting the camera and the light rig
  without waiting on a render.

      blender -b -P blender_stage.py -- --dump-layout stage_layout.json
      python3 -m http.server 8000      # ES modules will not load from file://
      open http://localhost:8000/stage_preview.html

  Every box, the camera and every light are read from stage_layout.json,
  which blender_stage.py writes from the scene it actually built. Re-dump
  after changing any geometry and this follows. Nothing here is authored by
  hand, which is the one thing the old stage_layout_editor.html got wrong —
  its box table drifted out of date and it would then write back a SECTIONS
  block that moved things that were already where you wanted them.

  The cue dropdown is the bridge to activity_*.png. That chart tells you WHEN
  to cut and to whom; pick the cue here and you see the shot it produces,
  framed by a port of _framing() reading the live camera values — so a change
  to CAM_POS or the lens re-frames every cue exactly as the render will.

  What it is honest about: WHERE the camera is, what it frames, where each
  light sits, which way it points, and what its cone covers on the floor.
  What it is NOT: an exposure match. three.js and EEVEE do not agree on what
  a watt is, so treat brightness here as relative between lights, never as a
  prediction of the render.
-->
<style>
  :root{
    --bg:#15171c; --panel:#1d2027; --line:#2c313b; --ink:#d7dbe3;
    --dim:#878fa0; --accent:#6cc4ff;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--ink);
       font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  #view{flex:1;position:relative;min-width:0}
  canvas{display:block}
  #hud{position:absolute;left:12px;top:12px;font:11px/1.5 ui-monospace,monospace;
       color:var(--dim);background:#0009;padding:6px 9px;border-radius:5px;pointer-events:none}
  #panel{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);
         overflow-y:auto;padding:14px}
  h1{font-size:13px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
  details{border-top:1px solid var(--line);padding:8px 0}
  details[open] summary{color:var(--accent)}
  summary{cursor:pointer;font-weight:600;padding:3px 0;user-select:none}
  .row{display:grid;grid-template-columns:58px 1fr 54px;gap:7px;align-items:center;margin:5px 0}
  .row label{color:var(--dim);font:11px ui-monospace,monospace}
  .row output{font:11px ui-monospace,monospace;text-align:right;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=color]{width:100%;height:22px;background:none;border:1px solid var(--line);
                    border-radius:3px;padding:1px}
  .chk{display:flex;gap:7px;align-items:center;margin:5px 0;color:var(--dim);font-size:12px}
  textarea{width:100%;height:210px;background:#000;color:#9fe6a0;border:1px solid var(--line);
           border-radius:4px;font:10px/1.4 ui-monospace,monospace;padding:7px;resize:vertical}
  button{background:var(--accent);color:#06263a;border:0;border-radius:4px;padding:6px 11px;
         font-weight:700;cursor:pointer;margin-top:7px}
  button.ghost{background:#2c313b;color:var(--ink);font-weight:500}
  #err{padding:20px;font:13px ui-monospace,monospace;color:#ff9a9a}
  select{width:100%;background:#12151a;color:var(--ink);border:1px solid var(--line);
         border-radius:4px;padding:6px;font:12px ui-monospace,monospace;margin-bottom:8px}
  input[type=text]{width:100%;background:#12151a;color:var(--ink);border:1px solid var(--line);
         border-radius:4px;padding:5px;font:11px ui-monospace,monospace;margin-bottom:6px}
  audio{width:100%;height:32px;margin-bottom:4px}
  #clock{font:11px ui-monospace,monospace;color:var(--dim)}
</style>
</head>
<body>
<div id="view"><div id="hud"></div></div>
<div id="panel">
  <h1>Stage preview</h1>
  <div id="stamp"></div>
  <select id="cue"></select>
  <div id="scrub"></div>
  <details open id="playbox"><summary>Play with the music</summary>
    <input id="audiosrc" type="text" spellcheck="false"
           placeholder="Uploads/ball9-….mp3">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="chk"><input type="checkbox" id="drive" checked>
      <label for="drive">Audio drives the camera, follow spot and backdrop</label></div>
    <div id="clock">—</div>
  </details>
  <div class="chk"><input type="checkbox" id="through"><label for="through">Look through render camera</label></div>
  <div class="chk"><input type="checkbox" id="instruments" checked><label for="instruments">Show instruments (stage.glb)</label></div>
  <div class="chk"><input type="checkbox" id="boxes" checked><label for="boxes">Show target boxes</label></div>
  <div class="chk"><input type="checkbox" id="players"><label for="players">Show individual instruments</label></div>
  <div class="chk"><input type="checkbox" id="cones" checked><label for="cones">Show light cones</label></div>
  <div class="chk"><input type="checkbox" id="labels" checked><label for="labels">Show names</label></div>
  <div id="controls"></div>
  <details open><summary>Paste back into blender_stage.py</summary>
    <textarea id="out" readonly></textarea>
    <button id="copy">Copy</button>
    <button id="reset" class="ghost">Reset</button>
  </details>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js",
            "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

// Blender is Z-up and so is everything in stage_layout.json. Rather than
// convert on the way in and back out — which is exactly where sign errors
// breed — run the whole scene Z-up so a number here IS the number you paste.
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

// no-store, because this file is re-dumped every time the cue sheet or the
// geometry changes and http.server sends no Cache-Control — so a plain reload
// will happily show you yesterday's cues and give no sign that it has.
// ?layout=stage_layout_bwv259.json picks another dump, so one page can show
// several chorales' sheets side by side without overwriting the default.
const LAYOUT = new URLSearchParams(location.search).get('layout') || 'stage_layout.json';
const L = await fetch(LAYOUT, {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status + ' ' + r.statusText)))
  .catch(e => {
    document.body.innerHTML = `<div id="err">Could not load ${LAYOUT} (${e.message}).<br><br>
      Generate it:<br>&nbsp;&nbsp;blender -b -P blender_stage.py -- --dump-layout stage_layout.json<br><br>
      and serve this page (file:// cannot load ES modules):<br>
      &nbsp;&nbsp;python3 -m http.server 8000</div>`;
    throw e;
  });

const START = structuredClone(L);          // for Reset
const view = document.getElementById('view');
const SECTION_NAMES = Object.keys(L.targets).filter(n => !n.includes('.'));
const PLAYER_NAMES  = Object.keys(L.targets).filter(n =>  n.includes('.'));

// ── scene ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);

const orbit = new THREE.PerspectiveCamera(45, 1, 0.5, 800);
orbit.position.set(28, -58, 34);
const controls = new OrbitControls(orbit, renderer.domElement);
controls.target.set(0, 6, 3);
controls.enableDamping = true;

// ── shot framing ────────────────────────────────────────────────────────────
// A port of _framing() / _framing_overhead() from blender_stage.py. It reads
// the LIVE camera values, so moving CAM_POS or the lens re-frames every cue
// the way it will in the render — which is the point of having both in one
// page. Keep in step with the Python if that ever changes.
const halfFovs = () => [Math.atan((L.cam.sensor / 2) / L.cam.lens),
                        Math.atan((L.cam.sensor / L.aspect / 2) / L.cam.lens)];
const shotNames = f => f[0] === 'overhead' ? f.slice(1) : f;

function unionBox(names){
  const b = names.map(n => L.targets[n]).filter(Boolean);
  if (!b.length) return null;
  return [Math.min(...b.map(v=>v[0])), Math.max(...b.map(v=>v[1])),
          Math.min(...b.map(v=>v[2])), Math.max(...b.map(v=>v[3])),
          Math.min(...b.map(v=>v[4])), Math.max(...b.map(v=>v[5]))];
}

function framingOverhead(name){
  const b = L.targets[name];
  const c = [(b[0]+b[1])/2, (b[2]+b[3])/2, (b[4]+b[5])/2];
  const [hH, hV] = halfFovs();
  const h = Math.max((b[1]-b[0])/2*L.margin / Math.tan(hH),
                     (b[3]-b[2])/2*L.margin / Math.tan(hV), 8.0);
  return {pos:[c[0], c[1] - h*0.75, c[2] + h*0.85], target:c};
}

function framing(focus, progress = 0){
  if (focus.length === 1 && focus[0] === 'wide')
    return {pos:[...L.cam.pos], target:[...L.cam.target]};
  if (focus[0] === 'overhead'){
    const a = framingOverhead(focus[1]), b = framingOverhead(focus[2]);
    const mix = (p, q) => p.map((v, i) => v + (q[i] - v) * progress);
    return {pos:mix(a.pos, b.pos), target:mix(a.target, b.target)};
  }
  const box = unionBox(shotNames(focus));
  if (!box) return {pos:[...L.cam.pos], target:[...L.cam.target]};
  const target = [(box[0]+box[1])/2, (box[2]+box[3])/2, (box[4]+box[5])/2];
  const [hH, hV] = halfFovs();
  const dist = Math.max((box[1]-box[0])/2*L.margin / Math.tan(hH),
                        (box[5]-box[4])/2*L.margin / Math.tan(hV), 6.0);
  const ax = [L.cam.pos[0]-L.cam.target[0], L.cam.pos[1]-L.cam.target[1],
              L.cam.pos[2]-L.cam.target[2]];
  const n = Math.hypot(...ax) || 1;
  const pos = target.map((v, i) => v + ax[i] / n * dist);
  pos[2] = Math.max(pos[2], 1.5);   // never dip below the stage floor
  return {pos, target};
}

// Which shot the render camera is showing: null = the authored wide camera.
let activeCue = null, cueProgress = 0;
const activeFraming = () =>
  activeCue === null ? {pos:[...L.cam.pos], target:[...L.cam.target]}
                     : framing(activeCue.focus, cueProgress);

// The real render camera, built from the same lens/sensor maths as the
// Blender one: horizontal FOV from sensor width, vertical from the aspect.
const shot = new THREE.PerspectiveCamera(30, L.aspect, 0.5, 800);
function syncShot(){
  const hFov = 2 * Math.atan((L.cam.sensor / 2) / L.cam.lens);
  shot.fov = 2 * Math.atan(Math.tan(hFov / 2) / L.aspect) * 180 / Math.PI;
  shot.aspect = L.aspect;
  const f = activeFraming();
  shot.position.set(...f.pos);
  shot.up.set(0, 0, 1);
  shot.lookAt(...f.target);
  shot.updateProjectionMatrix();
}

// Floor + a grid every 5 units, so distances are readable by eye.
scene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(160, 160),
  new THREE.MeshStandardMaterial({color:0x0d0f13, roughness:1})));
const grid = new THREE.GridHelper(160, 32, 0x39414f, 0x252a33);
grid.rotation.x = Math.PI / 2;
grid.position.z = 0.01;
scene.add(grid);

// Backdrop, emissive like the real one.
const bd = new THREE.Mesh(
  new THREE.PlaneGeometry(L.backdrop.w, L.backdrop.h),
  new THREE.MeshBasicMaterial({color:new THREE.Color(...L.backdrop.colors[0]), side:THREE.DoubleSide}));
bd.position.set(0, L.backdrop.y, L.backdrop.h / 2);
bd.rotation.x = Math.PI / 2;
scene.add(bd);

// ── boxes ───────────────────────────────────────────────────────────────────
const HUE = {pizz:0xe06c75, bowed_strings:0xc678dd, bass:0xd19a66, finger_piano:0xe5c07b,
             marimba:0x98c379, brass:0x61afef, woodwind:0x56b6c2, melody:0xabb2bf,
             conductor:0x7f848e};
function makeBoxes(names, opacity){
  const g = new THREE.Group();
  for (const n of names){
    const [x0,x1,y0,y1,z0,z1] = L.targets[n];
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(x1-x0, y1-y0, z1-z0),
      new THREE.MeshStandardMaterial({color:HUE[n.split('.')[0]] ?? 0x888888,
                                      roughness:0.75, transparent:true, opacity}));
    m.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
          new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.28})));
    m.userData.name = n;
    g.add(m);
  }
  return g;
}
const sectionBoxes = makeBoxes(SECTION_NAMES, 0.85);
const playerBoxes  = makeBoxes(PLAYER_NAMES, 0.95);
playerBoxes.visible = false;
scene.add(sectionBoxes, playerBoxes);

// Names, as sprites so they always face you.
const labels = new THREE.Group();
for (const n of SECTION_NAMES){
  const [x0,x1,y0,y1,,z1] = L.targets[n];
  const c = document.createElement('canvas');
  c.width = 256; c.height = 40;
  const g2 = c.getContext('2d');
  g2.font = 'bold 24px ui-monospace,monospace';
  g2.fillStyle = '#fff'; g2.textAlign = 'center';
  g2.fillText(n, 128, 28);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial(
    {map:new THREE.CanvasTexture(c), transparent:true, depthTest:false}));
  sp.position.set((x0+x1)/2, (y0+y1)/2, z1 + 1.6);
  sp.scale.set(11, 1.7, 1);
  labels.add(sp);
}
scene.add(labels);

// ── lights ──────────────────────────────────────────────────────────────────
// Energies are Blender watts; three.js has its own idea of intensity, so they
// are normalised against the brightest spot purely to keep relative weights.
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const maxWash = Math.max(...L.wash.map(w => w.energy));
const lightGroup = new THREE.Group(), coneGroup = new THREE.Group();
scene.add(lightGroup, coneGroup);

function sunDir(pitch, yaw){
  // Matches _sun(): a Blender sun points down -Z, rotated Rz(yaw)·Rx(pitch).
  const p = pitch * Math.PI/180, y = yaw * Math.PI/180;
  return new THREE.Vector3(-Math.sin(y)*Math.sin(p), Math.cos(y)*Math.sin(p), -Math.cos(p));
}

function rebuildLights(){
  for (const g of [lightGroup, coneGroup]){
    while (g.children.length) { const c = g.children.pop(); c.geometry?.dispose?.(); }
  }
  L.suns.forEach(s => {
    const d = new THREE.DirectionalLight(new THREE.Color(...s.color), s.energy * 1.6);
    d.position.copy(sunDir(s.pitch, s.yaw).multiplyScalar(-60));
    lightGroup.add(d, d.target);
    coneGroup.add(new THREE.ArrowHelper(sunDir(s.pitch, s.yaw), d.position, 60,
                                        new THREE.Color(...s.color).getHex(), 4, 2.5));
  });
  L.wash.forEach(w => {
    const col = new THREE.Color(...w.color);
    const sp = new THREE.SpotLight(col, (w.energy / maxWash) * 2.4,
                                   0, w.cone * Math.PI/360, 0.45, 0.6);
    sp.position.set(...w.pos);
    sp.target.position.set(...w.aim);
    lightGroup.add(sp, sp.target);
    // Cone drawn to where the axis meets the floor, so you can see its footprint.
    const from = new THREE.Vector3(...w.pos), to = new THREE.Vector3(...w.aim);
    const dir = to.clone().sub(from);
    const t = dir.z !== 0 ? -from.z / dir.z : 1;
    const len = dir.length() * Math.max(t, 0.2);
    const half = w.cone * Math.PI/360;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(Math.tan(half) * len, len, 28, 1, true),
      new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:0.09,
                                   side:THREE.DoubleSide, depthWrite:false}));
    cone.position.copy(from.clone().add(dir.clone().normalize().multiplyScalar(len/2)));
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir.clone().normalize());
    coneGroup.add(cone);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 8),
                                new THREE.MeshBasicMaterial({color:col}));
    ball.position.copy(from);
    coneGroup.add(ball);
  });
}

// ── camera gizmo ────────────────────────────────────────────────────────────
const gizmo = new THREE.Group();
scene.add(gizmo);
function rebuildGizmo(){
  while (gizmo.children.length) { const c = gizmo.children.pop(); c.geometry?.dispose?.(); }
  syncShot();
  const h = new THREE.CameraHelper(shot);
  h.material.depthTest = false;
  gizmo.add(h);
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 14, 10),
                              new THREE.MeshBasicMaterial({color:0x6cc4ff}));
  body.position.set(...L.cam.pos);
  const aim = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8),
                             new THREE.MeshBasicMaterial({color:0xffcc55}));
  aim.position.set(...L.cam.target);
  gizmo.add(body, aim, new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(...L.cam.pos), new THREE.Vector3(...L.cam.target)]),
    new THREE.LineBasicMaterial({color:0x6cc4ff, transparent:true, opacity:0.5})));
}

// ── controls ────────────────────────────────────────────────────────────────
const panel = document.getElementById('controls');
function slider(parent, label, min, max, step, get, set){
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${label}</label><input type=range min=${min} max=${max} step=${step}><output></output>`;
  const [inp, out] = [row.querySelector('input'), row.querySelector('output')];
  const show = () => { inp.value = get(); out.textContent = (+get()).toFixed(step < 1 ? 1 : 0); };
  inp.oninput = () => { set(+inp.value); show(); refresh(); };
  parent.appendChild(row);
  show();
  return show;
}
function colour(parent, get, set){
  const inp = document.createElement('input');
  inp.type = 'color';
  const hex = c => '#' + new THREE.Color(...c).getHexString();
  inp.value = hex(get());
  inp.oninput = () => { const c = new THREE.Color(inp.value); set([c.r, c.g, c.b]); refresh(); };
  parent.appendChild(inp);
  return () => { inp.value = hex(get()); };
}
const redraws = [];
function group(title, open, build){
  const d = document.createElement('details');
  if (open) d.open = true;
  d.innerHTML = `<summary>${title}</summary>`;
  panel.appendChild(d);
  build(d);
}

group('Camera', true, d => {
  ['x','y','z'].forEach((ax, i) =>
    redraws.push(slider(d, 'pos ' + ax, -80, 80, 0.5, () => L.cam.pos[i], v => L.cam.pos[i] = v)));
  ['x','y','z'].forEach((ax, i) =>
    redraws.push(slider(d, 'aim ' + ax, -40, 40, 0.5, () => L.cam.target[i], v => L.cam.target[i] = v)));
  redraws.push(slider(d, 'lens', 12, 120, 1, () => L.cam.lens, v => L.cam.lens = v));
});
L.suns.forEach((s, i) => group('Sun — ' + s.name, false, d => {
  redraws.push(slider(d, 'pitch', -90, 90, 1, () => L.suns[i].pitch, v => L.suns[i].pitch = v));
  redraws.push(slider(d, 'yaw', -180, 180, 1, () => L.suns[i].yaw, v => L.suns[i].yaw = v));
  redraws.push(slider(d, 'energy', 0, 5, 0.05, () => L.suns[i].energy, v => L.suns[i].energy = v));
  redraws.push(colour(d, () => L.suns[i].color, c => L.suns[i].color = c));
}));
L.wash.forEach((w, i) => group('Wash — ' + w.name, false, d => {
  ['x','y','z'].forEach((ax, j) =>
    redraws.push(slider(d, 'pos ' + ax, -80, 80, 1, () => L.wash[i].pos[j], v => L.wash[i].pos[j] = v)));
  ['x','y','z'].forEach((ax, j) =>
    redraws.push(slider(d, 'aim ' + ax, -40, 40, 1, () => L.wash[i].aim[j], v => L.wash[i].aim[j] = v)));
  redraws.push(slider(d, 'cone', 5, 140, 1, () => L.wash[i].cone, v => L.wash[i].cone = v));
  redraws.push(slider(d, 'kW', 0, 400, 5,
    () => L.wash[i].energy / 1000, v => L.wash[i].energy = v * 1000));
  redraws.push(colour(d, () => L.wash[i].color, c => L.wash[i].color = c));
}));

// ── cue picker ──────────────────────────────────────────────────────────────
// The bridge to activity_*.png: that chart says WHEN to cut and to whom, this
// says what the resulting shot actually looks like. Pick a cue, see its frame.
const cueSel = document.getElementById('cue');
const scrub = document.getElementById('scrub');
const mmss = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const focusLabel = f => f.length === 1 ? f[0]
  : f[0] === 'overhead' ? `overhead ${f[1]} → ${f[2]}` : f.join(' + ');

// Stamp the dump time on screen. Silently-stale data is the failure mode this
// page is most prone to — it reads a snapshot, and a cue edit is invisible
// here until --dump-layout runs again.
document.getElementById('stamp').textContent =
  `layout dumped ${L.dumped ?? '?'} · ${(L.cues || []).length} cues`;
document.getElementById('stamp').style.cssText =
  'color:#878fa0;font:10px ui-monospace,monospace;margin:-6px 0 8px';

const CUES = L.cues || [];
cueSel.innerHTML =
  `<option value="">— authored camera (CAM_POS) —</option>` +
  (CUES.length ? `<optgroup label="cue sheet">` + CUES.map((c, i) =>
      `<option value="c${i}">${mmss(c.t)}  ${focusLabel(c.focus)}` +
      `${c.move ? '  (move ' + c.move + 's)' : ''}</option>`).join('') + `</optgroup>` : '') +
  `<optgroup label="any target">` +
  Object.keys(L.targets).sort().map(n => `<option value="t${n}">${n}</option>`).join('') +
  `</optgroup>`;

cueSel.onchange = () => {
  const v = cueSel.value;
  scrub.innerHTML = '';
  cueProgress = 0;
  if (!v){ activeCue = null; }
  else if (v[0] === 'c'){ activeCue = CUES[+v.slice(1)]; }
  else { activeCue = {t:null, focus:[v.slice(1)], move:0}; }
  // Only a travelling overhead has anywhere to scrub to.
  if (activeCue && activeCue.focus[0] === 'overhead')
    slider(scrub, 'travel', 0, 1, 0.01, () => cueProgress, p => { cueProgress = p; });
  document.getElementById('through').checked = activeCue !== null;
  refresh();
};

// ── output ──────────────────────────────────────────────────────────────────
const out = document.getElementById('out');
const f = (n, d = 1) => (+n).toFixed(d);
function writeOut(){
  const v = (a, d = 1) => `(${a.map(x => f(x, d)).join(', ')})`;
  out.value =
`CAM_POS = ${v(L.cam.pos)}
CAM_TARGET = ${v(L.cam.target)}
CAM_LENS = ${f(L.cam.lens)}

WASH_SPOTS = [
${L.wash.map(w => `    (${JSON.stringify(w.name)}, ${v(w.color, 2)}, ${f(w.energy)}, ` +
                  `${v(w.pos)}, ${v(w.aim)}, ${f(w.cone)}, ${w.shadow ? 'True' : 'False'}),`).join('\n')}
]

SUNS = [
${L.suns.map(s => `    (${JSON.stringify(s.name)}, ${v(s.color, 2)}, ${f(s.energy, 2)}, ` +
                  `${f(s.pitch)}, ${f(s.yaw)}, ${f(s.angle)}, ${s.shadow ? 'True' : 'False'}),`).join('\n')}
]`;
}

document.getElementById('copy').onclick = e => {
  navigator.clipboard.writeText(out.value).then(() => {
    e.target.textContent = 'Copied';
    setTimeout(() => e.target.textContent = 'Copy', 1200);
  });
};
document.getElementById('reset').onclick = () => {
  L.cam = structuredClone(START.cam);
  L.suns = structuredClone(START.suns);
  L.wash = structuredClone(START.wash);
  redraws.forEach(r => r());
  refresh();
};
// Player boxes live INSIDE their section's box, so showing them on top of a
// solid section just buries them — the baritone guitar simply vanishes into
// the bass box. Ghost the sections that have players; leave the ones that do
// not (marimba, finger_piano, conductor) solid, or they would vanish too.
const HAS_PLAYERS = new Set(PLAYER_NAMES.map(n => n.split('.')[0]));
for (const [id, fn] of [
  ['players', v => {
     playerBoxes.visible = v;
     for (const m of sectionBoxes.children)
       m.material.opacity = (v && HAS_PLAYERS.has(m.userData.name)) ? 0.10 : 0.85;
   }],
  ['cones',   v => coneGroup.visible = v],
  ['labels',  v => labels.visible = v],
  ['through', () => resize()],
]) document.getElementById(id).onchange = e => { fn(e.target.checked); };

function refresh(){ rebuildLights(); rebuildGizmo(); writeOut(); }

// ── real instruments ────────────────────────────────────────────────────────
// The stage exported straight out of the scene Blender renders, rather than
// re-modelled here: the section builders are a couple of thousand lines of bpy
// mesh code and a hand port would drift. Optional — without stage.glb the page
// still works exactly as before, on boxes.
//
//     blender -b -P blender_stage.py -- --export-gltf stage.glb
//
// Exported with export_yup=False, so the model arrives Z-up like everything
// else here and needs no axis fixing on the way in.
const instruments = new THREE.Group();
scene.add(instruments);
// Surfaced on the stamp line: a silently-absent model would look identical to
// one that failed to parse, and this page's whole failure mode is stale or
// missing data that gives no sign of itself.
const stampEl = document.getElementById('stamp');
const baseStamp = stampEl.textContent;
const setStamp = s => { stampEl.textContent = `${baseStamp} · ${s}`; };
setStamp('loading stage.glb…');

new GLTFLoader().load('stage.glb',
  g => {
    instruments.add(g.scene);
    let meshes = 0;
    g.scene.traverse(o => { if (o.isMesh) meshes++; });
    setStamp(`stage.glb · ${meshes} meshes`);
    // Boxes are the fallback, so only hide them once the real thing arrives.
    document.getElementById('boxes').checked = false;
    sectionBoxes.visible = playerBoxes.visible = false;
  },
  xhr => { if (xhr.total) setStamp(`stage.glb ${(100 * xhr.loaded / xhr.total).toFixed(0)}%`); },
  () => setStamp('stage.glb missing — run --export-gltf, showing boxes'));

document.getElementById('instruments').onchange =
  e => { instruments.visible = e.target.checked; };
document.getElementById('boxes').onchange = e => {
  sectionBoxes.visible = e.target.checked;
  playerBoxes.visible = e.target.checked && document.getElementById('players').checked;
};

// ── the clock ───────────────────────────────────────────────────────────────
// The mp3 WreckingCrew wrote beside the .npy is the time source. Blender
// renders frames and muxes audio afterwards, so it can never show you sync;
// here the audio element IS the clock, which makes this the only place the
// cue sheet can be judged against the music it was written for.
const audio = document.getElementById('audio');
const audioSrc = document.getElementById('audiosrc');
const params = new URLSearchParams(location.search);
audioSrc.value = params.get('audio') || '';
if (audioSrc.value) audio.src = audioSrc.value;
audioSrc.onchange = () => { audio.src = audioSrc.value; audio.load(); };

// Ports of _smoothstep / _cue_index / _shot_progress from blender_stage.py.
const smoothstep = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const HOLD_SUM = (L.hold || [10, 15]).reduce((a, b) => a + b, 0);

function cueIndexAt(t){
  let i = 0;
  while (i + 1 < CUES.length && t >= CUES[i + 1].t) i++;
  return i;
}
function shotProgress(i, t){
  if (i + 1 >= CUES.length) return smoothstep((t - CUES[i].t) / (HOLD_SUM * 2));
  const span = CUES[i + 1].t - CUES[i].t;
  return span > 0 ? smoothstep((t - CUES[i].t) / span) : 0;
}

// Port of update_camera: a cue with move == 0 cuts, one with a positive value
// eases from the previous shot on BOTH position and aim, so the move arcs
// rather than snapping its aim partway through.
function framingAt(t){
  if (!CUES.length) return {pos:[...L.cam.pos], target:[...L.cam.target]};
  const i = cueIndexAt(t), cue = CUES[i];
  let f = framing(cue.focus, shotProgress(i, t));
  if (i > 0 && cue.move > 0){
    const blend = smoothstep((t - cue.t) / cue.move);
    if (blend < 1){
      const f0 = framing(CUES[i - 1].focus, 1.0);
      const mix = (a, b) => a.map((v, k) => v + (b[k] - v) * blend);
      f = {pos:mix(f0.pos, f.pos), target:mix(f0.target, f.target)};
    }
  }
  return f;
}

// Port of _shot_focus + update_follow: aim at the live shot, and widen the
// cone to suit its size — tight on a solo player, open on a wide.
function shotFocus(focus){
  const names = focus[0] === 'wide' ? SECTION_NAMES : shotNames(focus);
  const b = unionBox(names);
  if (!b) return null;
  return {centre:[(b[0]+b[1])/2, (b[2]+b[3])/2, (b[4]+b[5])/2],
          radius:Math.max((b[1]-b[0])/2, (b[5]-b[4])/2)};
}
function followAt(t){
  if (!CUES.length) return null;
  const i = cueIndexAt(t), cue = CUES[i];
  let f = shotFocus(cue.focus);
  if (!f) return null;
  if (i > 0 && cue.move > 0){
    const blend = smoothstep((t - cue.t) / cue.move);
    const f0 = shotFocus(CUES[i - 1].focus);
    if (blend < 1 && f0){
      f = {centre:f.centre.map((v, k) => f0.centre[k] + (v - f0.centre[k]) * blend),
           radius:f0.radius + (f.radius - f0.radius) * blend};
    }
  }
  const off = L.follow.offset, throwLen = Math.hypot(...off);
  return {pos:f.centre.map((v, k) => v + off[k]), aim:f.centre,
          angle:Math.min(140 * Math.PI / 180,
                         2 * Math.atan(f.radius * L.follow.margin / throwLen))};
}

const followSpot = new THREE.SpotLight(new THREE.Color(...L.follow.color), 2.0);
followSpot.penumbra = 0.55;
followSpot.distance = 0;
scene.add(followSpot, followSpot.target);

// Port of update_backdrop: cross-fade around the colour list on its own hold
// cycle, independent of the cue sheet.
function backdropAt(t){
  const cols = L.backdrop.colors, n = cols.length;
  const pos = (t / L.backdrop.hold) % n, i = Math.floor(pos);
  const blend = smoothstep(pos - i), a = cols[i], b = cols[(i + 1) % n];
  return a.map((v, k) => v + (b[k] - v) * blend);
}

// Drive everything from the audio clock. Returns the time shown, so the HUD
// and the cue dropdown can follow without recomputing it.
function applyTime(t){
  const f = framingAt(t);
  shot.position.set(...f.pos);
  shot.up.set(0, 0, 1);
  shot.lookAt(...f.target);
  shot.updateProjectionMatrix();

  const fl = followAt(t);
  if (fl){
    followSpot.visible = true;
    followSpot.position.set(...fl.pos);
    followSpot.target.position.set(...fl.aim);
    followSpot.target.updateMatrixWorld();
    followSpot.angle = fl.angle / 2;
  } else followSpot.visible = false;

  bd.material.color.setRGB(...backdropAt(t));
  return t;
}

// ── loop ────────────────────────────────────────────────────────────────────
const hud = document.getElementById('hud');
function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  orbit.aspect = w / h;
  orbit.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
refresh();

const clockEl = document.getElementById('clock');
const driveEl = document.getElementById('drive');
const mmssms = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;

renderer.setAnimationLoop(() => {
  controls.update();
  // When the audio is the clock it owns the camera: the cue dropdown follows
  // playback rather than driving it, so what you see is the cut the render
  // will make at that moment in the music.
  const driven = driveEl.checked && audio.src && !isNaN(audio.duration);
  if (driven){
    const t = applyTime(audio.currentTime);
    const i = CUES.length ? cueIndexAt(t) : -1;
    clockEl.textContent = `${mmssms(t)} / ${mmssms(audio.duration)}` +
      (i >= 0 ? `  ·  cue ${i + 1}/${CUES.length}  ${focusLabel(CUES[i].focus)}` : '');
    if (i >= 0 && cueSel.value !== 'c' + i) cueSel.value = 'c' + i;
  } else {
    followSpot.visible = false;
    clockEl.textContent = audio.src ? 'paused — audio not driving' : 'no audio loaded';
  }
  const through = document.getElementById('through').checked;
  gizmo.visible = !through;
  if (through){
    // Letterbox to the render aspect so what you see is what gets rendered.
    const w = view.clientWidth, h = view.clientHeight;
    const vw = Math.min(w, h * L.aspect), vh = vw / L.aspect;
    renderer.setViewport((w - vw) / 2, (h - vh) / 2, vw, vh);
    renderer.setScissor((w - vw) / 2, (h - vh) / 2, vw, vh);
    renderer.setScissorTest(true);
    renderer.render(scene, shot);
    renderer.setScissorTest(false);
  } else {
    renderer.setViewport(0, 0, view.clientWidth, view.clientHeight);
    renderer.render(scene, orbit);
  }
  const shotName = driven && CUES.length
    ? mmss(CUES[cueIndexAt(audio.currentTime)].t) + '  ' +
      focusLabel(CUES[cueIndexAt(audio.currentTime)].focus)
    : activeCue === null ? 'authored camera'
    : (activeCue.t === null ? '' : mmss(activeCue.t) + '  ') + focusLabel(activeCue.focus);
  hud.textContent = through
    ? `${shotName} · ${L.cam.lens.toFixed(0)}mm · ${L.aspect.toFixed(2)}:1`
    : `${shotName} — drag rotate · scroll zoom · right-drag pan`;
});
</script>
</body>
</html>
