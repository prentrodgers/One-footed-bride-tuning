# Kubernetes Job template for grid search parameter combination
# This template will be used to generate 20 individual Job manifests
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-search-JOBID
  labels:
    app: grid-search
    job-id: "JOBID"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    metadata:
      labels:
        app: grid-search
        job-id: "JOBID"
    spec:
      restartPolicy: Never
      securityContext:
        seLinuxOptions:
          level: s0
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: grid-search
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - fs2
                - fs3
                - fs4
                - fs5
                - fs7
                - fs8
                - fs9
      # No git-sync init container.  The repo is synced once per batch by
      # k8s-git-sync-job.yaml, which deploy-grid-search-jobs.sh runs and waits for
      # before submitting any of these.  Having all 360 sync the one shared
      # checkout serialised them on .git/index.lock and killed 23 of them.
      containers:
      - name: grid-search
        image: quay.io/prentrodgers/python-music:0.10
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        workingDir: /home/prent/Repos/One-footed-bride-tuning
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            # The whole job is grid_search.sh in single-cell mode — the same
            # script a workstation run uses, so the tuning command lives in
            # one place.  generate-grid-search-jobs.sh fills the placeholders.
            # The ratio is passed as the literal the cell directory is named
            # after (1.50, not 1.5).
            #
            # Scoped to one chorale per job: chorales are independent, and a
            # job that ran all twelve serially spent 12 x ~60s single-threaded
            # (the per-chorale loop, the Viterbi DP and enforce_continuity)
            # with most cores idle.  The cross-chorale table has to come from
            # the aggregation job once every job for a cell has finished.
            exec bash grid_search.sh \
                --limit_max LIMIT_MAX_VALUE \
                --tolerance TOLERANCE_VALUE \
                --ratio RATIO_VALUE \
                --chorale CHORALE_VALUE \
                --job_id JOBID
        volumeMounts:
        # The repo only, as a subPath, not the PVC root.  CRI-O relabels every
        # file under a mounted volume for SELinux before the container starts
        # (one MDS round trip each), and the root is the whole Dropbox, 763k
        # objects: that walk is what made pods wedge in CreateContainerError
        # and forced deploy-grid-search-jobs.sh down to one job per 3 minutes.
        # The repo tree is ~25k files.  Nothing the tuner touches lives
        # outside it: the music21 corpus is in the image and ~/Music/sflib is
        # only made, never read, so those fall in the container's own /home.
        # A writable home around it: with only the repo mounted, the image's
        # own /home/prent is root's, and the first `mkdir -p ~/Music/sflib`
        # in grid_search.sh failed every job with "Permission denied".  An
        # emptyDir is world-writable, so uid 1000 gets ~/.music21rc, caches
        # and that directory, all discarded with the pod.
        - mountPath: /home/prent
          name: home
        - mountPath: /home/prent/Repos/One-footed-bride-tuning
          name: ceph-files
          subPath: Repos/One-footed-bride-tuning
        env:
        # FRESH=0 keeps this chorale's saved tuning and lets the ratchet
        # accumulate across repeated passes; FRESH=1 wipes it and saves this
        # run unconditionally.  0 is the useful setting — grid_search.sh
        # explains why.
        - name: FRESH
          value: "0"
        # Keep equal to the cpu limit below: workers above it only contend.
        - name: VITERBI_WORKERS
          value: "4"
        - name: SFDIR
          value: "/home/prent/Music/sflib"
        - name: SSDIR
          value: "/home/prent/Music/sflib"
        - name: TZ
          value: "America/Los_Angeles"
        - name: HOME
          value: "/home/prent"
        - name: LOGNAME
          value: "prent"
        resources:
          # 4, not 8.  The eligible nodes are 14-24 CPU and none is a multiple of
          # 8, so 8-CPU pods stranded 14 cores across fs2-fs9 and pinned fs8 (14
          # CPU) to a single pod that wasted 6 of them.  At 4 only 6 cores strand
          # and roughly twice as many pods fit.
          #
          # It also leaves the node something to run the kubelet with.  At cpu 8
          # with eight workers a pod pinned every core it was given, and
          # container creation for the next job timed out against a saturated
          # machine:  Error: context deadline exceeded  /  stream terminated by
          # RST_STREAM with error code: CANCEL.
          #
          # Keep VITERBI_WORKERS (env, above) equal to this cpu value: workers
          # above the limit only contend.
          requests:
            cpu: "4"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
      volumes:
      - name: home
        emptyDir: {}
      - name: ceph-files
        persistentVolumeClaim:
          claimName: dropbox-pvc
          readOnly: false
      imagePullSecrets:
        - name: regcred

