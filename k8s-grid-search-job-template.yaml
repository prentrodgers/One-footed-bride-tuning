# Kubernetes Job template for grid search parameter combination
# This template will be used to generate 20 individual Job manifests
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-search-JOBID
  labels:
    app: grid-search
    job-id: "JOBID"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    metadata:
      labels:
        app: grid-search
        job-id: "JOBID"
    spec:
      restartPolicy: Never
      securityContext:
        seLinuxOptions:
          level: s0
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: grid-search
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - fs2
                - fs3
                - fs4
                - fs5
                - fs6
                - fs7
                - fs8
                - fs9
      initContainers:
      - name: git-sync
        image: quay.io/prentrodgers/python-music:0.7
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            REPO_DIR=/home/prent/Repos/One-footed-bride-tuning
            REPO_URL=https://github.com/prentrodgers/One-footed-bride-tuning.git
            if [ -d "$REPO_DIR/.git" ]; then
              # Mirror origin rather than merge into it.  The checkout lives on a
              # shared ceph volume that jobs write into, so `git pull` aborts the
              # moment any tracked file is dirty — WreckingCrew.py writes
              # {version}_features_array.npy into the repo root, and eleven of those
              # are tracked, so a pull that has to delete them refuses and the whole
              # job fails before it starts.  A deploy checkout should never merge.
              #
              # Deliberately NO `git clean`: results land in the untracked
              # Archive/straw-man/t*_r*_lm*/ directories, and cleaning would delete
              # every accumulated tuning the ratchet depends on.  `reset --hard`
              # touches tracked files only.
              echo "Repo exists — resetting to origin/main..."
              cd "$REPO_DIR"
              git fetch --prune origin
              git reset --hard origin/main
            else
              echo "Cloning repo..."
              mkdir -p /home/prent/Repos
              git clone "$REPO_URL" "$REPO_DIR"
            fi
            chgrp -R 1000 "$REPO_DIR"
            chmod -R g+rwX "$REPO_DIR"
            find "$REPO_DIR" -type d -exec chmod g+s {} +
            echo "Repo ready at $REPO_DIR"
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        env:
        - name: HOME
          value: "/home/prent"
      containers:
      - name: grid-search
        image: quay.io/prentrodgers/python-music:0.7
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        workingDir: /home/prent/Repos/One-footed-bride-tuning
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            
            # Parameters for this job
            LIMIT_MAX=LIMIT_MAX_VALUE
            TOLERANCE=TOLERANCE_VALUE
            RATIO=RATIO_VALUE
            STABILITY_FACTOR=0
            MAX_DELTA=33
            SPREAD=7
            INITIAL_TEMP=3.0
            MAX_GAP=33
            # Mirrors grid_search.sh.  FRESH=0 keeps this chorale's saved tuning and
            # lets the ratchet accumulate across repeated passes; FRESH=1 wipes it and
            # saves this run unconditionally.  0 is the useful setting: the tuner now
            # seeds the Viterbi trellis with the saved tuning, so a pass starts from
            # the path already on disk instead of rebuilding from 12-TET.  Wiping the
            # file first removes the thing that makes repeated passes converge — with
            # it in place eight of eight bwv261 cells improved and were accepted,
            # against 12 of 115 without.
            FRESH=0
            # One chorale per job.  Chorales are independent, and a job that ran all
            # twelve serially spent 12 x ~60s single-threaded (the per-chorale loop,
            # the Viterbi DP and enforce_continuity) with most cores idle.
            CHORALE=CHORALE_VALUE

            # Same directory scheme as grid_search.sh, and the one WreckingCrew.py
            # parses for tolerance/ratio/limit_max.  initial_temp is no longer part
            # of the name, so changing it overwrites the cell rather than making a
            # new one.
            DIR="Archive/straw-man/t${TOLERANCE}_r${RATIO}_lm${LIMIT_MAX}"

            echo "========================================"
            echo "Job JOBID starting"
            echo "chorale=${CHORALE}"
            echo "limit_max=${LIMIT_MAX}  tolerance=${TOLERANCE}  ratio_factor=${RATIO}"
            echo "initial_temp=${INITIAL_TEMP}  stability_factor=${STABILITY_FACTOR}  spread=${SPREAD}"
            echo "dir=${DIR}"
            echo "========================================"

            mkdir -p "$DIR"
            mkdir -p ~/Music/sflib

            # Scoped to ${CHORALE} throughout: the twelve per-chorale jobs for this
            # cell share $DIR, so a wildcard would have each job delete the other
            # eleven's results.  The ratchet is likewise per-file, so leaving the
            # incumbent in place costs the other jobs nothing.
            if [ "$FRESH" = "1" ]; then
                rm -f "$DIR/${CHORALE}-opt.npy" "$DIR/${CHORALE}-opt.txt"
                keep_flag="--no-keep_previous"
            else
                keep_flag="--keep_previous"
            fi

            # Step 1: tune with SA and viterbi optimization
            echo "Step 1: Running Straw_man_tuning_v2.py..."
            time python Straw_man_tuning_v2.py \
                --no-print_values --no-print_finals --no-print_initial \
                --rolls 4 --workers 1 --runs 1 \
                --limit_max "$LIMIT_MAX" \
                --chorale_list "$CHORALE" \
                --ratio_factor "$RATIO" \
                --tolerance "$TOLERANCE" \
                --max_delta "$MAX_DELTA" \
                --numpy_dir "$DIR" \
                --max_gap "$MAX_GAP" --retune_on_gaps 5 \
                "$keep_flag" \
                --stability_factor "$STABILITY_FACTOR" \
                --sa_iterations 1000 \
                --cooling_rate 0.999 \
                --initial_temp "$INITIAL_TEMP" \
                --spread "$SPREAD" \
                --use_viterbi \
                --k_candidates 15 \
                --viterbi_vertical_weight 1.0 \
                --viterbi_verbose \
                --viterbi_verbose_threshold 80 \
                --detect_phrases \
                --phrase_horizontal_weight 8.0 \
                --viterbi_workers 8

            # Step 2: spread analysis
            # (The old horizontal_transpose.py pass is gone: the Viterbi DP now
            # considers pitch-class-preserving whole-chord transpositions on every
            # transition and at phrase seams, so the greedy post-pass has nothing
            # left to shift.)
            #
            # Both analyses cover only this job's chorale.  The cross-chorale
            # table has to come from a separate aggregation run once every job
            # for a cell has finished.
            echo "Step 2: Running analyze_spread.py..."
            python analyze_spread.py \
                --numpy_dir "$DIR" \
                --chorale_list "$CHORALE" \
                --suffix="-opt.npy"

            # Step 3: adjacent-chord spread analysis
            echo "Step 3: Running analyze_adjacent_spread.py..."
            python analyze_adjacent_spread.py \
                --numpy_dir "$DIR" \
                --chorale_list "$CHORALE" \
                --suffix="-opt.npy" \
                --gap_threshold 15 \
                --top 20

            echo "========================================"
            echo "Job JOBID complete!"
            echo "Results saved to: $DIR (${CHORALE})"
            echo "========================================"
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        env:
        - name: SFDIR
          value: "/home/prent/Music/sflib"
        - name: SSDIR
          value: "/home/prent/Music/sflib"
        - name: TZ
          value: "America/Los_Angeles"
        - name: HOME
          value: "/home/prent"
        - name: LOGNAME
          value: "prent"
        resources:
          # Sized so several per-chorale jobs share a node: 8 cores each means
          # three concurrent jobs on a 24-core box, and one job's single-threaded
          # phase overlaps another's parallel phase instead of idling cores.
          # Keep --viterbi_workers equal to this cpu value.
          requests:
            cpu: "8"
            memory: "1Gi"
          limits:
            cpu: "8"
            memory: "8Gi"
      volumes:
      - name: ceph-files
        persistentVolumeClaim:
          claimName: dropbox-pvc
          readOnly: false
      imagePullSecrets:
        - name: regcred

