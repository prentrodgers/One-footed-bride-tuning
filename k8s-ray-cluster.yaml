# k8s-ray-cluster.yaml — the Ray cluster the tuning grid runs on.
#
# One (cell x chorale) tuning is one Ray task (ray_ratchet.py); this is the
# pool of worker processes those tasks run in.  It replaces the one-Job-per-
# cell scheme (k8s-grid-search-job-template.yaml, still there for a single
# cell by hand): a Job paid pod start-up — image check, SELinux relabel of the
# 25k-file repo mount, container create — for every tuning (~5.5 minutes for
# bwv415 on 4 CPUs), which is why deploy-grid-search-jobs.sh had to trickle
# them out one every 15-30s and 288 of them took over an hour to submit.
# Here the pods start once (about 100s for all nine) and a task is scheduled
# in milliseconds.
#
# Applied by ray-ratchet.sh at the start of a run and deleted at the end.  It
# is not meant to sit resident: its worker pods hold their CPU and memory
# whether or not a task is running, and that is most of what fs2-fs9 have
# free.  KubeRay (install-kuberay.sh) turns this manifest into pods.
#
# Everything mount- and security-related is copied from the Job template,
# where the comments explain each hard-won piece: the repo as a subPath (not
# the PVC root — relabelling the whole Dropbox is what wedged pods), the
# emptyDir home around it (the image's /home/prent is root's), seLinux level
# s0, uid 1000, node affinity to the nodes that can mount dropbox-pvc.
#
# ── Sizing (6 Oct 2026) ───────────────────────────────────────────────────
# One worker pod per node, sized to what the node has FREE after its resident
# pods (Ceph, monitoring, the jupyter deployment), not to its allocatable
# total.  A task takes 4 CPU (matching VITERBI_WORKERS=4; more workers than
# that only contend, see the Job template) so each pod's CPU is a multiple
# of 4:
#
#            allocatable   committed     pod        tasks   left
#   fs5       24 / 46Gi    5.9 / 34Gi    16 / 12Gi    4     2.1 / 0.7Gi  (jupyter + 4 OSDs)
#   fs7       24 / 30Gi    6.4 / 17Gi    16 / 12Gi    4     1.6 / 1.8Gi
#   fs9       24 / 30Gi    5.9 / 16Gi    16 / 12Gi    4     2.1 / 2.5Gi
#   fs2       18 / 31Gi    2.7 / 6.0Gi   12 / 12Gi    3     3.3 / 13Gi   (rook-ceph-tools: 2 CPU)
#   fs3       18 / 31Gi    5.8 / 16Gi    12 / 12Gi    3     0.2 / 3.2Gi  (Ceph mds a+b, mgr-b, rgw, operator)
#   fs4       20 / 62Gi    5.1 / 18Gi    12 / 12Gi    3     2.9 / 32Gi
#   fs6       16 / 30Gi    2.7 / 9.5Gi   12 / 12Gi    3     1.3 / 8.6Gi
#   fs8       18 / 31Gi    5.4 / 16Gi    12 / 12Gi    3     0.6 / 3.0Gi
#                                                    27 concurrent tasks
#   plus the head (0.5 CPU / 1.5Gi requested) on fs2, fs4, fs6 or fs9 — see
#   the headGroupSpec comment.
#
# The Ceph daemons that are Deployments (mds, mgr, rgw, operator, toolbox)
# move when a node reboots: fs2's memory upgrade (16 -> 32GB, 5 Oct) put
# ~6 CPU of them on fs3 and the 2-CPU toolbox on fs2, and fs2 and fs3 went
# from 16-CPU workers to Pending.  After any reboot, recheck "committed"
# (`kubectl describe node fsN | grep -A12 Allocated`) before a run.  fs3 has
# 0.2 CPU to spare: anything new there and its worker is Pending.
#
# Requests equal limits (Guaranteed QoS) so Ray's idea of the node matches
# what the kubelet enforces.  A task declares memory=2.5GiB to Ray so four fit
# in a 12Gi pod with the object store taken out — the Job template allowed
# 8Gi per task but requested 1Gi, and the real peak has not been measured;
# the Ray dashboard shows it per task, adjust --task_memory_gb in
# ray_ratchet.py if it turns out larger.  If a pod is Pending, something new
# is resident on that node: `kubectl describe node fsN | grep -A12 Allocated`.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: tuning
  labels:
    app: ray-tuning
spec:
  rayVersion: "2.58.0"        # must match the ray in the image (parallel-jobs/Containerfile RAY_VER)

  headGroupSpec:
    rayStartParams:
      # No tasks on the head: it runs the GCS, the dashboard and the ratchet
      # driver, and a 4-CPU tuning next to those would starve them.
      num-cpus: "0"
      dashboard-host: "0.0.0.0"
    # The dashboard's NodePort is the separate Service at the end of this
    # file, not a headService here: KubeRay appends its own generated ports
    # to a user-supplied headService, so a fixed nodePort on the dashboard
    # port collides with the generated copy and the Service is rejected.
    template:
      metadata:
        labels:
          app: ray-tuning
      spec:
        securityContext:
          seLinuxOptions:
            level: s0
        # The head shares a node with one of the workers, so it can only go
        # where the table's arithmetic leaves room for it after that worker:
        # fs2 (3.3 CPU, 13Gi left), fs4 (2.9, 32Gi), fs6 (1.3, 8.6Gi) and
        # fs9 (2.1, 2.5Gi).  Not fs7 (1.8Gi) or fs5/fs3/fs8 (too little).
        # Anywhere else it takes the CPU the node's worker needed and that
        # worker sits Pending — which is what happened on fs3 the first time.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fs2, fs4, fs6, fs9]
        containers:
        - name: ray-head
          image: quay.io/prentrodgers/python-music:0.11
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          # KubeRay's default probes call wget, which python:3.12-slim does
          # not have (curl is in the image).  Same endpoints, with curl.
          livenessProbe: &head-probe
            exec:
              command: ["bash", "-c", "curl -sf http://localhost:52365/api/local_raylet_healthz && curl -sf http://localhost:8265/api/gcs_healthz"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe: *head-probe
          # Small requests so it fits in that slack; burstable limits because
          # select_best_and_render.py runs here at the end of a run.
          resources:
            requests: {cpu: "500m", memory: "1536Mi"}
            limits:   {cpu: "2", memory: "3Gi"}
          volumeMounts: &mounts
          - mountPath: /home/prent
            name: home
          - mountPath: /home/prent/Repos/One-footed-bride-tuning
            name: ceph-files
            subPath: Repos/One-footed-bride-tuning
          - mountPath: /dev/shm
            name: shm
          env:
          # Where the Ray dashboard's Metrics tab finds Grafana and Prometheus
          # (kube-prometheus-stack, namespace prometheus).  The first two are
          # for the head itself, in-cluster.  IFRAME_HOST is what the BROWSER
          # loads the embedded panels from: Grafana's NodePort, on the same
          # host IP as this dashboard's NodePort (headService above) so the
          # browser treats them as one site and sends the Grafana login
          # cookie into the iframes.  Open the dashboard on THIS IP
          # (fs7, which also runs Grafana), not another node's, or the
          # frames show login pages instead.  Grafana must also allow
          # embedding at all; see k8s-prometheus-stack-values.yaml.
          # Scraping is k8s-ray-monitoring.yaml, the dashboards
          # ray-grafana-dashboards.sh.  Head only: workers serve no dashboard.
          - name: RAY_GRAFANA_HOST
            value: "http://kube-prometheus-stack-grafana.prometheus:80"
          - name: RAY_PROMETHEUS_HOST
            value: "http://kube-prometheus-stack-prometheus.prometheus:9090"
          - name: RAY_GRAFANA_IFRAME_HOST
            value: "http://192.168.68.14:30814"
          - name: RAY_PROMETHEUS_NAME
            value: "Prometheus"
          # The tuner's environment, shared with the workers below.
          - name: FRESH
            value: "0"
          - name: VITERBI_WORKERS
            value: "4"
          - name: SFDIR
            value: "/home/prent/Music/sflib"
          - name: SSDIR
            value: "/home/prent/Music/sflib"
          - name: TZ
            value: "America/Los_Angeles"
          - name: HOME
            value: "/home/prent"
          - name: LOGNAME
            value: "prent"
        volumes: &volumes
        - name: home
          emptyDir: {}
        - name: ceph-files
          persistentVolumeClaim:
            claimName: dropbox-pvc
            readOnly: false
        # Ray's object store lives in /dev/shm; a container's default 64MB
        # makes Ray fall back to /tmp with a warning.  Tasks here return a
        # dict of a dozen numbers, so the store (rayStartParams below) is
        # small and this only needs to be a little bigger than it.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        imagePullSecrets:
        - name: regcred

  workerGroupSpecs:
  # Two groups differing only in size and node list — see the table above.
  # The group name is in the pod name (tuning-w16-worker-xxxxx).
  - groupName: w16
    replicas: 3
    minReplicas: 3
    maxReplicas: 3
    rayStartParams:
      num-cpus: "16"
      object-store-memory: "500000000"
    template:
      metadata:
        labels:
          app: ray-tuning
      spec:
        securityContext:
          seLinuxOptions:
            level: s0
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fs5, fs7, fs9]
          # One pod per node: a second on the same node would not fit anyway,
          # and this makes the failure a clear Pending instead of a surprise.
          podAntiAffinity: &one-per-node
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ray-tuning
                  ray.io/node-type: worker
        containers:
        - name: ray-worker
          image: quay.io/prentrodgers/python-music:0.11
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          livenessProbe: &worker-probe
            exec:
              command: ["bash", "-c", "curl -sf http://localhost:52365/api/local_raylet_healthz"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe: *worker-probe
          resources:
            requests: {cpu: "16", memory: "12Gi"}
            limits:   {cpu: "16", memory: "12Gi"}
          volumeMounts: *mounts
          env: &env
          # The tuner's environment, as in the Job template.  Ray worker
          # processes inherit the raylet's environment, and the task's
          # subprocess inherits theirs, so this reaches grid_search.sh.
          - name: FRESH
            value: "0"
          - name: VITERBI_WORKERS
            value: "4"
          - name: SFDIR
            value: "/home/prent/Music/sflib"
          - name: SSDIR
            value: "/home/prent/Music/sflib"
          - name: TZ
            value: "America/Los_Angeles"
          - name: HOME
            value: "/home/prent"
          - name: LOGNAME
            value: "prent"
        volumes: *volumes
        imagePullSecrets:
        - name: regcred

  - groupName: w12
    replicas: 5
    minReplicas: 5
    maxReplicas: 5
    rayStartParams:
      num-cpus: "12"
      object-store-memory: "500000000"
    template:
      metadata:
        labels:
          app: ray-tuning
      spec:
        securityContext:
          seLinuxOptions:
            level: s0
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fs2, fs3, fs4, fs6, fs8]
          podAntiAffinity: *one-per-node
        containers:
        - name: ray-worker
          image: quay.io/prentrodgers/python-music:0.11
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          livenessProbe: *worker-probe
          readinessProbe: *worker-probe
          resources:
            requests: {cpu: "12", memory: "12Gi"}
            limits:   {cpu: "12", memory: "12Gi"}
          volumeMounts: *mounts
          env: *env
        volumes: *volumes
        imagePullSecrets:
        - name: regcred
---
# The Ray dashboard on the LAN, like Grafana:  http://<any node IP>:30265
# — no port-forward.  A Service of our own beside KubeRay's tuning-head-svc
# (which stays ClusterIP and carries gcs, the port the workers join
# through); it selects the head pod by the labels KubeRay gives it.
#
# Same host IP as Grafana's NodePort (30814) means the two are one site to
# the browser, so the Grafana login cookie reaches the panels the
# dashboard's Metrics tab embeds — Grafana needs allow_embedding, not
# anonymous access.
#
# Trade-off, chosen 20 Sep 2026: the Ray dashboard has no login of its own
# and its API submits jobs, so while the cluster is up anyone on the LAN
# can run code on it.  The cluster only exists for the hours of a run
# (ray-ratchet.sh deletes it, and this Service with it), and the LAN is
# the one kubectl runs from.  Prefer a port-forward?  Delete this Service
# and use   kubectl port-forward svc/tuning-head-svc 8265:8265
apiVersion: v1
kind: Service
metadata:
  name: tuning-dashboard
  labels:
    app: ray-tuning
spec:
  type: NodePort
  selector:
    ray.io/cluster: tuning
    ray.io/node-type: head
  ports:
  - name: dashboard
    port: 8265
    targetPort: 8265
    nodePort: 30265
