 # Jupyter Lab server for One-footed-bride-tuning: tuning → mp3 pipeline.
# Init container clones or pulls the repo, then the main container starts Jupyter Lab.
#
# Usage:
#   kubectl apply -f one-footed-bride-jupyter.yaml
#   kubectl delete -f one-footed-bride-jupyter.yaml
#
# Access: http://<node-ip>:30004
# Remote-SSH (optional):
#   1) kubectl create secret generic one-footed-bride-ssh-authorized-keys \
#        --from-file=authorized_keys=$HOME/.ssh/id_ed25519.pub
#   2) kubectl apply -f one-footed-bride-jupyter.yaml
#   3) Connect from VS Code Remote-SSH to <node-ip>:30222 (user: prent)
apiVersion: v1
kind: Service
metadata:
  name: one-footed-bride
  labels:
    app: one-footed-bride
spec:
  type: NodePort
  ports:
  - port: 80
    name: http
    targetPort: 8888
    nodePort: 30004
  selector:
    app: one-footed-bride
---
apiVersion: v1
kind: Service
metadata:
  name: one-footed-bride-ssh
  labels:
    app: one-footed-bride
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  ports:
  - port: 22
    name: ssh
    targetPort: 2222
    nodePort: 30222
  selector:
    app: one-footed-bride
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: one-footed-bride-sshd-config
  labels:
    app: one-footed-bride
data:
  sshd_config: |
    Port 2222
    ListenAddress 0.0.0.0
    HostKey /etc/ssh/ssh_host_ed25519_key
    Protocol 2
    PermitRootLogin no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ChallengeResponseAuthentication no
    PubkeyAuthentication yes
    UsePAM no
    PermitEmptyPasswords no
    AuthorizedKeysFile .ssh/authorized_keys
    AllowUsers prent
    X11Forwarding no
    AllowTcpForwarding yes
    PermitTunnel no
    GatewayPorts no
    MaxAuthTries 3
    MaxSessions 5
    ClientAliveInterval 60
    ClientAliveCountMax 2
    Subsystem sftp internal-sftp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: one-footed-bride
  name: one-footed-bride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: one-footed-bride
  template:
    metadata:
      labels:
        app: one-footed-bride
    spec:
      nodeSelector:
        kubernetes.io/hostname: fs5          # Arc Pro B70 node (GPU render)
      securityContext:
        supplementalGroups:
          - 992                              # 'render' group on fs5 (getent group
                                             # render -> render:x:992) — access to the
                                             # passed-through GPU render nodes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - one-footed-bride
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: git-sync
        image: quay.io/prentrodgers/python-music:0.10
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            REPO_DIR=/home/prent/Repos/One-footed-bride-tuning
            REPO_URL=https://github.com/prentrodgers/One-footed-bride-tuning.git
            git lfs install
            if [ -d "$REPO_DIR/.git" ]; then
              echo "Repo exists — pulling latest..."
              cd "$REPO_DIR" && git pull && git lfs pull
            else
              echo "Cloning repo..."
              mkdir -p /home/prent/Repos
              git clone "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR" && git lfs pull
            fi
            chgrp -R 1000 "$REPO_DIR"
            chmod -R g+rwX "$REPO_DIR"
            find "$REPO_DIR" -type d -exec chmod g+s {} +
            echo "Repo ready at $REPO_DIR"
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        env:
        - name: HOME
          value: "/home/prent"
      containers:
      - name: one-footed-bride
        image: quay.io/prentrodgers/python-music:0.10
        imagePullPolicy: IfNotPresent
        workingDir: /home/prent/Repos/One-footed-bride-tuning
        securityContext:
          runAsUser: 1000
        command: ["jupyter", "lab"]
        args:
          - "--ip=0.0.0.0"
          - "--port=8888"
          - "--no-browser"
          - "--allow-root"
          - "--NotebookApp.token=''"
          - "--ServerApp.allow_origin=*"
          - "--notebook-dir=/home/prent/Repos/One-footed-bride-tuning"
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        # Arc B70 render nodes (headless EGL GPU rendering, see draft Containerfile)
        - name: dri-render129
          mountPath: /dev/dri/renderD129
        - name: dri-render130
          mountPath: /dev/dri/renderD130
        env:
        - name: SFDIR
          value: "/home/prent/Music/sflib"
        - name: SSDIR
          value: "/home/prent/Music/sflib"
        - name: TZ
          value: "America/Los_Angeles"
        - name: HOME
          value: "/home/prent"
        - name: LOGNAME
          value: "prent"
        - name: IMAGE_VERSION
          value: "quay.io/prentrodgers/python-music:0.8"
        resources:
          requests:
            cpu: "0.5"
            memory: "8Gi"
          limits:
            cpu: "30"
            memory: "16Gi"
      - name: pod-ssh
        image: quay.io/prentrodgers/python-music:0.10
        imagePullPolicy: IfNotPresent
        securityContext:
          # privileged so the container's device cgroup lets processes OPEN
          # the passed-through GPU render nodes — a hostPath mount only makes
          # /dev/dri/renderD* visible; without privileged the device cgroup
          # denies open() with EPERM (even for root), forcing Blender onto the
          # llvmpipe software fallback. Matches the vLLM deployment's pattern.
          privileged: true
          capabilities:
            add:
            - SYS_CHROOT
            - AUDIT_WRITE
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            if ! command -v sshd >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
              rm -rf /var/lib/apt/lists/*
            fi
            if ! id -u prent >/dev/null 2>&1; then
              useradd -m -d /home/prent -s /bin/bash -u 1000 prent
            fi
            # Put prent in the render group (GID 992 on fs5) so interactive SSH
            # sessions can open the passed-through GPU render node — the pod-
            # level supplementalGroups applies to sshd, but a fresh login shell
            # rebuilds its groups from /etc/group, so prent must be a member.
            groupadd -g 992 render 2>/dev/null || true
            usermod -aG render prent 2>/dev/null || true
            passwd -d prent >/dev/null 2>&1 || true
            mkdir -p /home/prent/.ssh /home/prent/.ssh-hostkeys /run/sshd
            cp /etc/ssh-secrets/authorized_keys /home/prent/.ssh/authorized_keys
            chown -R prent:prent /home/prent/.ssh
            chmod 700 /home/prent/.ssh
            chmod 600 /home/prent/.ssh/authorized_keys
            if [ ! -s /home/prent/.ssh-hostkeys/ssh_host_ed25519_key ]; then
              ssh-keygen -t ed25519 -N '' -f /home/prent/.ssh-hostkeys/ssh_host_ed25519_key
            fi
            install -m 600 /home/prent/.ssh-hostkeys/ssh_host_ed25519_key /etc/ssh/ssh_host_ed25519_key
            install -m 644 /home/prent/.ssh-hostkeys/ssh_host_ed25519_key.pub /etc/ssh/ssh_host_ed25519_key.pub
            exec /usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
        ports:
        - containerPort: 2222
          name: ssh
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        - name: ssh-authorized-keys
          mountPath: /etc/ssh-secrets
          readOnly: true
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
          readOnly: true
        # Arc B70 render nodes — this is the container you SSH into to render
        - name: dri-render129
          mountPath: /dev/dri/renderD129
        - name: dri-render130
          mountPath: /dev/dri/renderD130
        env:
        - name: HOME
          value: "/home/prent"
        - name: TZ
          value: "America/Los_Angeles"
        resources:
          requests:
            cpu: "0.5"
            memory: "8Gi"
          limits:
            cpu: "30"
            memory: "16Gi"
      volumes:
      - name: ceph-files
        persistentVolumeClaim:
          claimName: dropbox-pvc
          readOnly: false
      # Arc Pro B70 render nodes on fs5 (verified 2026-07-14 in the llm-scaler
      # deployment): renderD129 -> PCI 0000:04:00.0 (GPU #0),
      # renderD130 -> 0000:08:00.0 (GPU #1). The iGPU (renderD128) is left out
      # on purpose so Blender's EGL only ever enumerates the two Arc cards.
      - name: dri-render129
        hostPath:
          path: /dev/dri/renderD129
          type: CharDevice
      - name: dri-render130
        hostPath:
          path: /dev/dri/renderD130
          type: CharDevice
      - name: ssh-authorized-keys
        secret:
          secretName: one-footed-bride-ssh-authorized-keys
          defaultMode: 0400
      - name: sshd-config
        configMap:
          name: one-footed-bride-sshd-config
          defaultMode: 0444
      imagePullSecrets:
        - name: regcred
