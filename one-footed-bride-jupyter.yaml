# Jupyter Lab server for One-footed-bride-tuning: tuning → mp3 pipeline.
# Init container clones or pulls the repo, then the main container starts Jupyter Lab.
#
# Usage:
#   kubectl apply -f one-footed-bride-jupyter.yaml
#   kubectl delete -f one-footed-bride-jupyter.yaml
#
# Access: http://<node-ip>:30005
apiVersion: v1
kind: Service
metadata:
  name: one-footed-bride
  labels:
    app: one-footed-bride
spec:
  type: NodePort
  ports:
  - port: 80
    name: http
    targetPort: 8888
    nodePort: 30004
  selector:
    app: one-footed-bride
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: one-footed-bride
  name: one-footed-bride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: one-footed-bride
  template:
    metadata:
      labels:
        app: one-footed-bride
    spec:
      nodeSelector:
        # kubernetes.io/hostname: fs6
        # intel.feature.node.kubernetes.io/gpu: "true"
      initContainers:
      - name: git-sync
        image: quay.io/prentrodgers/python-music:0.5
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            REPO_DIR=/home/prent/Repos/One-footed-bride-tuning
            REPO_URL=https://github.com/prentrodgers/One-footed-bride-tuning.git
            if [ -d "$REPO_DIR/.git" ]; then
              echo "Repo exists — pulling latest..."
              cd "$REPO_DIR" && git pull
            else
              echo "Cloning repo..."
              mkdir -p /home/prent/Repos
              git clone "$REPO_URL" "$REPO_DIR"
            fi
            echo "Repo ready at $REPO_DIR"
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        env:
        - name: HOME
          value: "/home/prent"
      containers:
      - name: one-footed-bride
        image: quay.io/prentrodgers/python-music:0.5
        imagePullPolicy: IfNotPresent
        workingDir: /home/prent/Repos/One-footed-bride-tuning
        command: ["jupyter", "lab"]
        args:
          - "--ip=0.0.0.0"
          - "--port=8888"
          - "--no-browser"
          - "--allow-root"
          - "--NotebookApp.token=''"
          - "--ServerApp.allow_origin=*"
          - "--notebook-dir=/home/prent/Repos/One-footed-bride-tuning"
        volumeMounts:
        - mountPath: /home/prent
          name: ceph-files
        env:
        - name: SFDIR
          value: "/home/prent/Music/sflib"
        - name: SSDIR
          value: "/home/prent/Music/sflib"
        - name: TZ
          value: "America/Los_Angeles"
        - name: HOME
          value: "/home/prent"
        - name: LOGNAME
          value: "prent"
        - name: IMAGE_VERSION
          value: "quay.io/prentrodgers/python-music:0.5"
        resources:
          requests:
            cpu: "0.5"
            memory: "8Gi"
          limits:
            cpu: "30"
            memory: "16Gi"
      volumes:
      - name: ceph-files
        persistentVolumeClaim:
          claimName: dropbox-pvc
          readOnly: false
      imagePullSecrets:
        - name: regcred
